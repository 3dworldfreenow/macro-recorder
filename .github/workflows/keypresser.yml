name: Build KeyPresser

on:
  push:
    paths: ["KeyPresser.py", "tests/keytest.ps1", ".github/workflows/keypresser.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pynput pyinstaller
      - name: Build (folder + single exe)
        run: |
          python -m PyInstaller --noconfirm --onedir --windowed --noupx --name KeyPresser KeyPresser.py
          python -m PyInstaller --noconfirm --onefile --windowed --noupx --name KeyPresser --distpath dist1 KeyPresser.py
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist\KeyPresser -DestinationPath KeyPresser.zip -Force

      - name: Test on Windows (8 presses into a test window)
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          Start-Process pwsh -ArgumentList "-NoProfile -File tests\keytest.ps1"
          Start-Sleep 6
          $p = Start-Process dist\KeyPresser\KeyPresser.exe -ArgumentList "--start --delay 6 --limit 8 --quit-when-done --log $pwd\presser_log.txt" -PassThru
          Start-Sleep 4
          $ws = New-Object -ComObject WScript.Shell
          $ws.AppActivate("KeyTest") | Out-Null
          Start-Sleep 6
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$pwd\keypresser_screen.png")
          $p | Wait-Process -Timeout 60 -ErrorAction SilentlyContinue
          Get-Process KeyPresser -ErrorAction SilentlyContinue | Stop-Process
          "--- presser log"; Get-Content presser_log.txt
          "--- received"; Get-Content keytest_received.txt -ErrorAction SilentlyContinue
          $t = Get-Content presser_log.txt | ForEach-Object { [double]($_.Split(' ')[0]) }
          $gaps = for ($i = 1; $i -lt $t.Count; $i++) { [math]::Round($t[$i] - $t[$i-1], 2) }
          "Gaps: $($gaps -join ', ')"
          $recv = @(Get-Content keytest_received.txt -ErrorAction SilentlyContinue | Where-Object { $_ -like "Right *" }).Count
          "Sent: $($t.Count)  Received by test window: $recv"
          if ($t.Count -ne 8) { throw "expected 8 presses" }
          if ($recv -ne 8) { throw "test window did not get all presses" }
          foreach ($g in $gaps) { if ($g -gt 2.3) { throw "gap too long: $g" } }
          "TEST PASSED"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: keypresser
          name: KeyPresser (latest build)
          body: |
            Presses a key (default Right Arrow) again and again with a random 0-2 s gap.
            **KeyPresser.zip** (recommended): unzip, open the KeyPresser folder, run KeyPresser.exe.
          files: |
            KeyPresser.zip
            dist1/KeyPresser.exe
            keypresser_screen.png
          make_latest: false
