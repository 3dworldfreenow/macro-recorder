name: Build KeyPresser

on:
  push:
    paths: ["KeyPresser.py", "tests/**", ".github/workflows/keypresser.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pynput pyinstaller
      - name: Build (folder + single exe)
        run: |
          python -m PyInstaller --noconfirm --onedir --windowed --noupx --name KeyPresser KeyPresser.py
          python -m PyInstaller --noconfirm --onefile --windowed --noupx --name KeyPresser --distpath dist1 KeyPresser.py
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist\KeyPresser -DestinationPath KeyPresser.zip -Force

      - name: Test on Windows (key + 2 click points for 14 s)
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          Start-Process pwsh -ArgumentList "-NoProfile -File tests\keytest.ps1"
          Start-Sleep 6
          $a = "--mode timers --start --no-settings --delay 4 --min 0 --max 2 --point 800,420,1,2 --point 700,480,2,3 --run-for 14 --quit-when-done --log $pwd\presser_log.txt"
          $p = Start-Process dist\KeyPresser\KeyPresser.exe -ArgumentList $a -PassThru
          Start-Sleep 3
          $ws = New-Object -ComObject WScript.Shell
          $ws.AppActivate("KeyTest") | Out-Null
          Start-Sleep 10
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$pwd\keypresser_screen.png")
          $p | Wait-Process -Timeout 60 -ErrorAction SilentlyContinue
          Get-Process KeyPresser -ErrorAction SilentlyContinue | Stop-Process
          "--- presser log"; Get-Content presser_log.txt
          "--- received by test window"; Get-Content keytest_received.txt -ErrorAction SilentlyContinue
          $log = Get-Content presser_log.txt
          $keysSent = @($log | Where-Object { $_ -match " key " }).Count
          $recv = @(Get-Content keytest_received.txt -ErrorAction SilentlyContinue)
          $keysRecv = @($recv | Where-Object { $_ -like "Right *" }).Count
          $c1 = @($recv | Where-Object { $_ -match "^Click \d+ 800 420$" }).Count
          $c2 = @($recv | Where-Object { $_ -match "^Click \d+ 700 480$" }).Count
          $t1 = @($log | Where-Object { $_ -match "click 1 " } | ForEach-Object { [double]($_.Split(' ')[0]) })
          $g1 = for ($i = 1; $i -lt $t1.Count; $i++) { [math]::Round($t1[$i] - $t1[$i-1], 2) }
          $t2 = @($log | Where-Object { $_ -match "click 2 " } | ForEach-Object { [double]($_.Split(' ')[0]) })
          $g2 = for ($i = 1; $i -lt $t2.Count; $i++) { [math]::Round($t2[$i] - $t2[$i-1], 2) }
          "Keys sent: $keysSent  received: $keysRecv"
          "Point 1 (800,420 every 1-2s) clicks received: $c1  gaps: $($g1 -join ', ')"
          "Point 2 (700,480 every 2-3s) clicks received: $c2  gaps: $($g2 -join ', ')"
          if ($keysSent -lt 5) { throw "too few key presses" }
          if ($keysRecv -lt ($keysSent - 2)) { throw "test window missed key presses" }
          if ($c1 -lt 5 -or $c2 -lt 3) { throw "too few clicks received" }
          foreach ($g in $g1) { if ($g -lt 0.95 -or $g -gt 2.4) { throw "point 1 gap out of range: $g" } }
          foreach ($g in $g2) { if ($g -lt 1.95 -or $g -gt 3.4) { throw "point 2 gap out of range: $g" } }
          "TEST PASSED"

      - name: Test links (1 once + 1 repeating every 3-4 s, for 13 s)
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $a = "--mode timers --start --no-settings --no-key --tab links --delay 1 --link example.com --link https://example.org|3|4 --run-for 13 --quit-when-done --log $pwd\links_log.txt"
          $p = Start-Process dist\KeyPresser\KeyPresser.exe -ArgumentList $a -PassThru
          Start-Sleep 9
          $ws = New-Object -ComObject WScript.Shell
          Start-Sleep 1
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$pwd\keypresser_links_screen.png")
          $p | Wait-Process -Timeout 60 -ErrorAction SilentlyContinue
          Get-Process KeyPresser -ErrorAction SilentlyContinue | Stop-Process
          "--- links log"; Get-Content links_log.txt
          $log = Get-Content links_log.txt
          $once = @($log | Where-Object { $_ -match " link 1 https://example.com$" }).Count
          $t2 = @($log | Where-Object { $_ -match " link 2 https://example.org$" } | ForEach-Object { [double]($_.Split(' ')[0]) })
          $g2 = for ($i = 1; $i -lt $t2.Count; $i++) { [math]::Round($t2[$i] - $t2[$i-1], 2) }
          $browsers = @(Get-Process msedge, chrome, firefox -ErrorAction SilentlyContinue).Count
          "Once link opened: $once time(s)"
          "Repeat link opened: $($t2.Count) times, gaps: $($g2 -join ', ')"
          "Browser processes running: $browsers"
          if ($once -ne 1) { throw "once-link should open exactly 1 time" }
          if ($t2.Count -lt 3) { throw "repeat link opened too few times" }
          foreach ($g in $g2) { if ($g -lt 2.95 -or $g -gt 4.4) { throw "repeat gap out of range: $g" } }
          if ($browsers -lt 1) { throw "no browser opened" }
          "LINK TEST PASSED"

      - name: Test touch Pick point (tap at 333,444)
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          Add-Type @"
          using System; using System.Runtime.InteropServices;
          public class M {
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);
            [DllImport("user32.dll")] public static extern void mouse_event(int f, int dx, int dy, int d, int e);
            [DllImport("user32.dll")] public static extern bool SetProcessDPIAware();
          }
          "@
          [M]::SetProcessDPIAware() | Out-Null
          Remove-Item dist\KeyPresser\keypresser_settings.json -ErrorAction SilentlyContinue
          $p = Start-Process dist\KeyPresser\KeyPresser.exe -ArgumentList "--open-picker --quit-after-pick" -PassThru
          Start-Sleep 7
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$pwd\keypresser_pick_screen.png")
          [M]::SetCursorPos(333, 444) | Out-Null
          Start-Sleep -Milliseconds 300
          [M]::mouse_event(2, 0, 0, 0, 0); Start-Sleep -Milliseconds 60; [M]::mouse_event(4, 0, 0, 0, 0)
          $p | Wait-Process -Timeout 30 -ErrorAction SilentlyContinue
          Get-Process KeyPresser -ErrorAction SilentlyContinue | Stop-Process
          $j = Get-Content dist\KeyPresser\keypresser_settings.json -Raw | ConvertFrom-Json
          $pt = $j.points[0]
          "Saved point: X $($pt.x)  Y $($pt.y)  every $($pt.min)-$($pt.max)s"
          if ($j.points.Count -ne 1 -or $pt.x -ne 333 -or $pt.y -ne 444) { throw "picked point wrong" }
          "PICK TEST PASSED"
          Remove-Item dist\KeyPresser\keypresser_settings.json

      - name: Test sequence (click x3 -> key x2 -> wait, 2 loops)
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          Get-Process msedge -ErrorAction SilentlyContinue | Stop-Process -Force
          Remove-Item keytest_received.txt -ErrorAction SilentlyContinue
          Start-Process pwsh -ArgumentList "-NoProfile -File tests\keytest.ps1"
          Start-Sleep 6
          $a = "--mode sequence --seq-file tests\seq_test.json --start --no-settings --delay 3 --quit-when-done --log $pwd\seq_log.txt"
          $p = Start-Process dist\KeyPresser\KeyPresser.exe -ArgumentList $a -PassThru
          Start-Sleep 2
          (New-Object -ComObject WScript.Shell).AppActivate("KeyTest") | Out-Null
          Start-Sleep 3
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$pwd\kp_running.png")
          $p | Wait-Process -Timeout 60 -ErrorAction SilentlyContinue
          Get-Process KeyPresser -ErrorAction SilentlyContinue | Stop-Process
          Get-Process pwsh | Where-Object { $_.MainWindowTitle -eq "KeyTest" } | Stop-Process
          "--- sequence log"; Get-Content seq_log.txt
          $log = @(Get-Content seq_log.txt)
          $kinds = ($log | ForEach-Object { $_.Split(' ')[4] }) -join ','
          "Order: $kinds"
          $want = "click,click,click,key,key,click,click,click,key,key"
          if ($kinds -ne $want) { throw "wrong order" }
          $t = $log | ForEach-Object { [double]($_.Split(' ')[0]) }
          $g = for ($i = 1; $i -lt $t.Count; $i++) { [math]::Round($t[$i] - $t[$i-1], 2) }
          "Gaps: $($g -join ', ')"
          # expected: 0.5,0.5 | 1.0 | 0.3 | 0.5+1.5=2.0 | 0.5,0.5 | 1.0 | 0.3
          $exp = 0.5,0.5,1.0,0.3,2.0,0.5,0.5,1.0,0.3
          for ($i = 0; $i -lt $exp.Count; $i++) { if ($g[$i] -lt $exp[$i] - 0.05 -or $g[$i] -gt $exp[$i] + 0.45) { throw "gap $i = $($g[$i]) expected ~$($exp[$i])" } }
          $recv = @(Get-Content keytest_received.txt)
          $c = @($recv | Where-Object { $_ -match "^Click \d+ 800 420$" }).Count
          $k = @($recv | Where-Object { $_ -like "Right *" }).Count
          "Test window got: $c clicks at 800,420 and $k Right keys"
          if ($c -ne 6 -or $k -ne 4) { throw "test window did not get 6 clicks + 4 keys" }
          "SEQUENCE TEST PASSED"

      - name: Test sequence with link (2 loops, 2 s apart)
        shell: pwsh
        run: |
          $a = "--mode sequence --seq-file tests\seq_link.json --start --no-settings --delay 1 --quit-when-done --log $pwd\seqlink_log.txt"
          Start-Process dist\KeyPresser\KeyPresser.exe -ArgumentList $a -PassThru | Wait-Process -Timeout 60 -ErrorAction SilentlyContinue
          $log = @(Get-Content seqlink_log.txt); $log
          if ($log.Count -ne 2 -or $log[0] -notmatch "link https://example.com$") { throw "link step did not run twice" }
          $gap = [math]::Round([double]$log[1].Split(' ')[0] - [double]$log[0].Split(' ')[0], 2)
          "Gap: $gap"
          if ($gap -lt 1.95 -or $gap -gt 2.6) { throw "link gap wrong" }
          "SEQUENCE LINK TEST PASSED"

      - name: Test once / every loop steps (3 loops)
        shell: pwsh
        run: |
          $a = "--mode sequence --seq-file tests\seq_once.json --start --no-settings --delay 1 --quit-when-done --log $pwd\seqonce_log.txt"
          Start-Process dist\KeyPresser\KeyPresser.exe -ArgumentList $a -PassThru | Wait-Process -Timeout 60 -ErrorAction SilentlyContinue
          $log = @(Get-Content seqonce_log.txt); $log
          $order = ($log | ForEach-Object { $_.Split(' ')[5] }) -join ','
          "Order: $order"
          if ($order -ne "Home,End,End,End") { throw "once step should run only in loop 1" }
          "ONCE/EVERY TEST PASSED"

      - name: Screenshots (sequence tab, step editor)
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          Get-Process msedge -ErrorAction SilentlyContinue | Stop-Process -Force
          $p = Start-Process dist\KeyPresser\KeyPresser.exe -ArgumentList "--no-settings --seq-file tests\seq_demo.json --tab sequence" -PassThru
          Start-Sleep 6
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$pwd\kp_sequence.png")
          $p | Stop-Process
          Start-Sleep 1
          $p = Start-Process dist\KeyPresser\KeyPresser.exe -ArgumentList "--no-settings --seq-file tests\seq_demo.json --open-step-editor 1" -PassThru
          Start-Sleep 6
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$pwd\kp_step_click.png")
          $p | Stop-Process
          Start-Sleep 1
          $p = Start-Process dist\KeyPresser\KeyPresser.exe -ArgumentList "--no-settings --seq-file tests\seq_demo.json --open-step-editor 2" -PassThru
          Start-Sleep 6
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$pwd\kp_step_key.png")
          $p | Stop-Process

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: keypresser
          name: KeyPresser (latest build)
          body: |
            Presses a key (default Right Arrow) with a random 0-2 s gap, and clicks screen points you choose, each on its own random timer (default 10-20 s). F7 adds a point at the mouse. Opens links once or on a repeat timer.
            **KeyPresser.zip** (recommended): unzip, open the KeyPresser folder, run KeyPresser.exe.
          files: |
            KeyPresser.zip
            dist1/KeyPresser.exe
            keypresser_screen.png
            keypresser_links_screen.png
            keypresser_pick_screen.png
            kp_running.png
            kp_sequence.png
            kp_step_click.png
            kp_step_key.png
          make_latest: false
