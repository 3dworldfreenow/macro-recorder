name: Build Android APK

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"
      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Copy APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk KeyPresser.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash android/test/run_test.sh
      - name: Publish release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android
          name: KeyPresser for Android (latest build)
          prerelease: true
          body: |
            KeyPresser for Android. Download **KeyPresser.apk**, open it on your phone to install.
            After installing: turn on Accessibility for KeyPresser and allow the floating window.
          files: |
            KeyPresser.apk
            android-shots/*.png
            run_log.txt
