name: Build Windows EXE

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packages
        run: python -m pip install pynput pyinstaller
      - name: Build exe
        run: python -m PyInstaller --onefile --windowed --name MacroRecorder MacroRecorder.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacroRecorder
          path: dist/MacroRecorder.exe
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: MacroRecorder (latest build)
          files: dist/MacroRecorder.exe
          make_latest: true
