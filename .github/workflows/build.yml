name: Build Windows EXE

on:
  push:
    paths: ["MacroRecorder.py", "version_info.txt", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packages
        run: python -m pip install pynput pyinstaller
      - name: Build folder version (zip) - fewer antivirus warnings
        run: python -m PyInstaller --noconfirm --onedir --windowed --noupx --version-file version_info.txt --name MacroRecorder MacroRecorder.py
      - name: Make zip
        shell: pwsh
        run: Compress-Archive -Path dist\MacroRecorder -DestinationPath MacroRecorder.zip -Force
      - name: Build single-file exe
        run: python -m PyInstaller --noconfirm --onefile --windowed --noupx --version-file version_info.txt --name MacroRecorder --distpath dist1 MacroRecorder.py
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: MacroRecorder (latest build)
          body: |
            **MacroRecorder.zip** (recommended): unzip it, open the MacroRecorder folder, double-click MacroRecorder.exe.
            **MacroRecorder.exe**: single file, but antivirus is more likely to warn about it.
          files: |
            MacroRecorder.zip
            dist1/MacroRecorder.exe
          make_latest: true
